name: Build Glossed Tip APK

on:
  push:
    branches: [main]
    paths:
      - 'glossed-tip/**'
      - '.github/workflows/build-glossed-tip.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glossed-tip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Calculate next Glossed Tip build number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' \
            | sed -n 's/^glossed-tip-v\([0-9][0-9][0-9]\)$/\1/p' \
            | sort -n | tail -1)
          if [ -z "$LATEST" ]; then NEXT=1; else NEXT=$((10#$LATEST + 1)); fi
          VERSION=$(printf "%03d" "$NEXT")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=glossed-tip-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=glossed-tip-v${VERSION}" >> "$GITHUB_ENV"

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          test -n "$APK_PATH"
          cp "$APK_PATH" "dist/$APK_NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: glossed-tip-v${{ env.VERSION }}
          path: glossed-tip/dist/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "dist/$APK_NAME" \
            --title "Glossed Tip v$VERSION" \
            --notes "Automated tested debug APK from main at commit $GITHUB_SHA. Portfolio/demo build." \
            --target "$GITHUB_SHA" \
            --prerelease
