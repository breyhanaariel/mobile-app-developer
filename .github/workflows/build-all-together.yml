name: Build AllTogether Mobile Release

on:
  push:
    branches: [main]
    paths:
      - 'all-together/**'
      - '.github/workflows/build-all-together.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: alltogether-main-release
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      CI: '1'
      NODE_ENV: development
    defaults:
      run:
        working-directory: all-together

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install mobile dependencies
        run: npm install

      - name: Validate Expo dependency alignment
        run: npx expo install --check

      - name: Typecheck mobile app
        run: npm run typecheck

      - name: Test mobile app
        run: npm test

      - name: Install API dependencies
        run: npm install
        working-directory: all-together/server

      - name: Typecheck API
        run: npm run typecheck
        working-directory: all-together/server

      - name: Test API
        run: npm test -- --passWithNoTests
        working-directory: all-together/server

      - name: Build API
        run: npm run build
        working-directory: all-together/server

      - name: Validate iOS native project generation
        run: npx expo prebuild --platform ios --no-install

      - name: Prebuild Android project
        run: npx expo prebuild --platform android

      - name: Build Android debug APK
        run: ./gradlew assembleDebug
        working-directory: all-together/android

      - name: Calculate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh release list --limit 100 --json tagName --jq '[.[].tagName | select(test("^all-together-v[0-9]{3}$")) | sub("all-together-v"; "") | tonumber] | max // 0')
          NEXT=$((LAST + 1))
          VERSION=$(printf "%03d" "$NEXT")
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=all-together-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=all-together-v$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Package APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.version.outputs.apk }}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.tag }}
          path: all-together/dist/${{ steps.version.outputs.apk }}
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/${{ steps.version.outputs.apk }}" \
            --repo "${{ github.repository }}" \
            --title "AllTogether v${{ steps.version.outputs.number }}" \
            --notes "Automated tested AllTogether portfolio prerelease from main. Mobile typecheck/tests, API typecheck/tests/build, iOS native-project generation, and Android native compilation passed. Live provider credentials remain outside GitHub." \
            --prerelease
